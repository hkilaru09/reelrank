name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests + synthetic smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests (synthetic fixtures only, no MovieLens data)
        run: pytest -q
      - name: End-to-end smoke run on synthetic data
        run: python scripts/run_experiments.py --dataset synthetic --quick --no-mlflow --out /tmp/results --artifacts /tmp/artifacts

  docker:
    name: Serving image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reelrank .
