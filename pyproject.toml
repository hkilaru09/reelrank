[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelrank"
version = "0.1.0"
description = "Two-stage movie recommender: two-tower retrieval + LambdaRank, with a full-catalog evaluation"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = [
    "ignore:The argument .eval_set. is deprecated",
   "ignore::DeprecationWarning", "ignore::UserWarning", "ignore::RuntimeWarning:implicit"]
